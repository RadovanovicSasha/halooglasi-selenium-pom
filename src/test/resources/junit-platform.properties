# Parallel execution is opt-in and off by default, so `mvn test` stays
# single-threaded and deterministic against the shared live test account
# (see README "Parallel Execution"). Enable per-run with:
#   mvn test -Djunit.jupiter.execution.parallel.enabled=true
# System properties override this file, so no pom.xml change is needed.
junit.jupiter.execution.parallel.enabled=false
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=2
junit.jupiter.execution.parallel.config.fixed.max-pool-size=2
