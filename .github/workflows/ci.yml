name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      groups:
        description: 'JUnit tag expression to run (e.g. "login", "e2e", "smoke | regression")'
        required: false
        default: 'login'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      # Push runs only what never touches the live account (no login-tagged
      # tests); a manual dispatch targets whatever tag expression is given,
      # defaulting to the login-tagged suite. See README, "CI Scope & Known
      # Limitations".
      GROUPS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.groups || 'smoke | (regression & !login)' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Maven tests
        run: mvn clean test -Denv=prod "-Dgroups=${GROUPS}"

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
